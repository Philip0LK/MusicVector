title = "MusicVector secret checks"

[extend]
useDefault = true

[[rules]]
id = "musicvector-provider-key"
description = "OpenAI-compatible provider key"
regex = '''\bsk-[A-Za-z0-9_-]{20,}\b'''
keywords = ["sk-"]

[[rules]]
id = "musicvector-glm-key"
description = "Zhipu GLM provider key"
regex = '''\b[0-9a-f]{32}\.[A-Za-z0-9]{16}\b'''

[[rules]]
id = "musicvector-signing-password"
description = "Android signing password"
regex = '''(?i)(?:storePassword|keyPassword)\s*[:=]\s*["']?([^\s"']{1,})'''
secretGroup = 1
keywords = ["storePassword", "keyPassword"]

# 仅排除读取配置的表达式和模板中的两句占位文字；不排除文件或整类规则。
[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^keystoreProperties\.getProperty\($''', '''^改成你的密钥(?:库)?口令$''']
